<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heinbergo System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d0d1a 0%, #0f2027 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #e94560, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #888;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* ── Storage bar ── */
    .storage-bar {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
      flex-shrink: 0;
    }

    .storage-info {
      flex: 1;
      font-size: 0.9rem;
      color: #aaa;
    }

    .storage-info span {
      color: #666;
      font-size: 0.8rem;
      margin-left: 8px;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.97); }

    .btn-primary   { background: #e94560; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #e0e0e0; }
    .btn-ghost     { background: rgba(255,255,255,0.06); color: #aaa; }
    .btn-danger {
      background: rgba(233,69,96,0.2);
      color: #e94560;
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .btn-small { padding: 6px 12px; font-size: 0.85rem; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value { font-size: 1.8rem; font-weight: 700; }
    .stat-total     .stat-value { color: #a29bfe; }
    .stat-confirmed .stat-value { color: #2ecc71; }
    .stat-pending   .stat-value { color: #f39c12; }
    .stat-collected .stat-value { color: #e94560; font-size: 1.3rem; }

    /* ── Section cards ── */
    .section-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Add row ── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-row input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input[type="text"]:focus { border-color: #e94560; }

    /* ── Lists ── */
    .guest-list, .insumo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .guest-item, .insumo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      transition: background 0.2s, border-color 0.2s;
    }

    .guest-item.confirmed {
      background: rgba(46,204,113,0.08);
      border-color: rgba(46,204,113,0.2);
    }

    .guest-name, .insumo-name { flex: 1; font-size: 0.9rem; }

    /* ── Custom checkbox ── */
    .custom-checkbox {
      position: relative;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .custom-checkbox input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-checkbox input:checked ~ .checkmark {
      background: #2ecc71;
      border-color: #2ecc71;
    }
    .checkmark::after {
      content: '';
      display: none;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .custom-checkbox input:checked ~ .checkmark::after { display: block; }

    /* ── Insumo qty ── */
    .insumo-qty {
      width: 70px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 4px 8px;
      color: #e0e0e0;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }
    .insumo-qty:focus { border-color: #f39c12; }

    /* ── Config grid ── */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 600px) {
      .config-grid { grid-template-columns: 1fr; }
    }

    .config-field { display: flex; flex-direction: column; gap: 6px; }
    .config-field.full-width { grid-column: 1 / -1; }

    .config-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .config-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .config-input:focus { border-color: #a29bfe; }
    textarea.config-input { resize: vertical; min-height: 80px; }

    /* ── Recaudado box ── */
    .recaudado-box {
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-top: 16px;
    }
    .recaudado-formula { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
    .recaudado-total   { font-size: 1.5rem; font-weight: 700; color: #e94560; }

    /* ── Insumos subsection ── */
    .insumos-sub {
      margin-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .toast {
      background: rgba(30,30,50,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #e0e0e0;
      animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
      max-width: 280px;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .empty-state {
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      padding: 20px;
    }

    /* ── Danger zone ── */
    .danger-zone {
      margin-top: 8px;
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>Heinbergo System</h1>
    <p>Organizador de Eventos</p>
  </header>

  <!-- Storage bar -->
  <div class="storage-bar">
    <div class="dot"></div>
    <span class="storage-info">
      Guardado en este navegador
      <span id="last-saved"></span>
    </span>
    <button class="btn-ghost btn-small" id="btn-export">&#x2193; Exportar</button>
    <button class="btn-ghost btn-small" id="btn-import">&#x2191; Importar</button>
    <input type="file" id="input-import" accept=".json" style="display:none">
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card stat-total">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card stat-confirmed">
      <div class="stat-label">Confirmados</div>
      <div class="stat-value" id="stat-confirmed">0</div>
    </div>
    <div class="stat-card stat-pending">
      <div class="stat-label">Pendientes</div>
      <div class="stat-value" id="stat-pending">0</div>
    </div>
    <div class="stat-card stat-collected">
      <div class="stat-label">Recaudado</div>
      <div class="stat-value" id="stat-collected">$0</div>
    </div>
  </div>

  <!-- Guests -->
  <div class="section-card" id="guests-section">
    <div class="section-title">&#x1F465; Invitados</div>
    <div class="add-row">
      <input type="text" id="new-guest" placeholder="Nombre del invitado...">
      <button class="btn-primary btn-small" id="btn-add-guest">+ Agregar</button>
    </div>
    <div class="guest-list" id="guest-list"></div>
  </div>

  <!-- Config -->
  <div class="section-card" id="config-section">
    <div class="section-title">&#x2699;&#xFE0F; Configuraci&#xF3;n</div>
    <div class="config-grid">
      <div class="config-field">
        <label class="config-label">Nombre del Evento</label>
        <input type="text" class="config-input" id="cfg-evento" placeholder="Mi Evento">
      </div>
      <div class="config-field">
        <label class="config-label">Fecha</label>
        <input type="text" class="config-input" id="cfg-fecha" placeholder="DD/MM/AAAA">
      </div>
      <div class="config-field">
        <label class="config-label">Importe por Persona</label>
        <input type="number" class="config-input" id="cfg-importe" placeholder="0" min="0">
      </div>
      <div class="config-field">
        <label class="config-label">Lugar</label>
        <input type="text" class="config-input" id="cfg-lugar" placeholder="Direcci&#xF3;n o lugar">
      </div>
      <div class="config-field full-width">
        <label class="config-label">Notas</label>
        <textarea class="config-input" id="cfg-notas" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>

    <div class="recaudado-box">
      <div class="recaudado-formula" id="recaudado-formula">0 confirmados &times; $0</div>
      <div class="recaudado-total" id="recaudado-total">$0</div>
    </div>

    <!-- Insumos -->
    <div class="insumos-sub">
      <div class="section-title">&#x1F4E6; Insumos</div>
      <div class="add-row">
        <input type="text" id="new-insumo" placeholder="Nombre del insumo...">
        <button class="btn-primary btn-small" id="btn-add-insumo">+ Agregar</button>
      </div>
      <div class="insumo-list" id="insumo-list"></div>
    </div>

    <!-- Borrar todo -->
    <div class="danger-zone">
      <button class="btn-danger" id="btn-reset">&#x1F5D1; Borrar todo</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ══════════════════════════════════════════
    // localStorage
    // ══════════════════════════════════════════
    const LS_KEY = 'heinbergo_data';

    function loadData() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) { return null; }
    }

    function saveData() {
      localStorage.setItem(LS_KEY, JSON.stringify(appData));
      const now = new Date();
      document.getElementById('last-saved').textContent =
        '· guardado ' + now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    // ══════════════════════════════════════════
    // Estado
    // ══════════════════════════════════════════
    let appData = {
      guests:  [],
      config:  { evento: '', fecha: '', importe: '', lugar: '', notas: '' },
      insumos: []
    };

    // ══════════════════════════════════════════
    // Render
    // ══════════════════════════════════════════
    function renderGuests() {
      const list = document.getElementById('guest-list');
      if (appData.guests.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay invitados a&#xFA;n</div>';
        return;
      }
      list.innerHTML = appData.guests.map((g, i) => `
        <div class="guest-item${g.checked ? ' confirmed' : ''}">
          <span class="guest-name">${esc(g.name)}</span>
          <label class="custom-checkbox">
            <input type="checkbox" ${g.checked ? 'checked' : ''}
              onchange="toggleGuest(${i}, this.checked)">
            <span class="checkmark"></span>
          </label>
          <button class="btn-danger" onclick="removeGuest(${i})">&#x2715;</button>
        </div>
      `).join('');
    }

    function renderInsumos() {
      const list = document.getElementById('insumo-list');
      if (appData.insumos.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay insumos a&#xFA;n</div>';
        return;
      }
      list.innerHTML = appData.insumos.map((ins, i) => `
        <div class="insumo-item">
          <span class="insumo-name">${esc(ins.name)}</span>
          <input type="number" class="insumo-qty" value="${esc(ins.qty)}" min="0"
            oninput="updateInsumoQty(${i}, this.value)">
          <button class="btn-danger" onclick="removeInsumo(${i})">&#x2715;</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total     = appData.guests.length;
      const confirmed = appData.guests.filter(g => g.checked).length;
      const pending   = total - confirmed;
      const importe   = parseFloat(appData.config.importe) || 0;
      const collected = confirmed * importe;

      document.getElementById('stat-total').textContent     = total;
      document.getElementById('stat-confirmed').textContent = confirmed;
      document.getElementById('stat-pending').textContent   = pending;
      document.getElementById('stat-collected').textContent = fmtCurrency(collected);

      document.getElementById('recaudado-formula').textContent =
        `${confirmed} confirmados \u00d7 $${importe.toLocaleString('es-AR')}`;
      document.getElementById('recaudado-total').textContent = fmtCurrency(collected);
    }

    function renderConfig() {
      ['evento', 'fecha', 'importe', 'lugar', 'notas'].forEach(k => {
        document.getElementById('cfg-' + k).value = appData.config[k] || '';
      });
    }

    function renderAll() {
      renderGuests();
      renderInsumos();
      renderConfig();
      updateStats();
    }

    // ══════════════════════════════════════════
    // Acciones
    // ══════════════════════════════════════════
    function toggleGuest(i, checked) {
      appData.guests[i].checked = checked;
      saveData(); renderAll();
    }

    function removeGuest(i) {
      const name = appData.guests[i].name;
      appData.guests.splice(i, 1);
      saveData(); renderAll();
      showToast(`"${name}" eliminado`);
    }

    function addGuest() {
      const input = document.getElementById('new-guest');
      const name  = input.value.trim();
      if (!name) return;
      if (appData.guests.some(g => g.name.toLowerCase() === name.toLowerCase())) {
        showToast('Ese invitado ya existe'); return;
      }
      appData.guests.push({ name, checked: false });
      input.value = '';
      saveData(); renderAll();
      showToast(`"${name}" agregado`);
    }

    function addInsumo() {
      const input = document.getElementById('new-insumo');
      const name  = input.value.trim();
      if (!name) return;
      appData.insumos.push({ name, qty: '0' });
      input.value = '';
      saveData(); renderAll();
      showToast(`"${name}" agregado`);
    }

    function removeInsumo(i) {
      const name = appData.insumos[i].name;
      appData.insumos.splice(i, 1);
      saveData(); renderAll();
      showToast(`"${name}" eliminado`);
    }

    function updateInsumoQty(i, value) {
      appData.insumos[i].qty = value;
      saveData(); updateStats();
    }

    // Config en tiempo real
    ['evento', 'fecha', 'importe', 'lugar', 'notas'].forEach(k => {
      document.getElementById('cfg-' + k).addEventListener('input', function () {
        appData.config[k] = this.value;
        saveData(); updateStats();
      });
    });

    // Enter para agregar
    document.getElementById('new-guest').addEventListener('keydown',  e => { if (e.key === 'Enter') addGuest(); });
    document.getElementById('new-insumo').addEventListener('keydown', e => { if (e.key === 'Enter') addInsumo(); });
    document.getElementById('btn-add-guest').addEventListener('click',  addGuest);
    document.getElementById('btn-add-insumo').addEventListener('click', addInsumo);

    // Borrar todo
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('\u00bfBorrar todos los datos? Esta acci\u00f3n no se puede deshacer.')) return;
      appData = {
        guests:  [],
        config:  { evento: '', fecha: '', importe: '', lugar: '', notas: '' },
        insumos: []
      };
      saveData(); renderAll();
      showToast('Datos borrados');
    });

    // ══════════════════════════════════════════
    // Exportar / Importar JSON
    // ══════════════════════════════════════════
    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      const name = (appData.config.evento || 'heinbergo') + '.json';
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exportado: ' + name);
    });

    document.getElementById('btn-import').addEventListener('click', () => {
      document.getElementById('input-import').click();
    });

    document.getElementById('input-import').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.guests || !imported.config || !imported.insumos)
            throw new Error('Formato incorrecto');
          appData = imported;
          saveData(); renderAll();
          showToast('Importado: ' + file.name);
        } catch (err) {
          showToast('Error al importar: ' + err.message);
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // ══════════════════════════════════════════
    // Utils
    // ══════════════════════════════════════════
    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className   = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3100);
    }

    function fmtCurrency(v) {
      return '$' + v.toLocaleString('es-AR');
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ══════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════
    const saved = loadData();
    if (saved) appData = saved;
    renderAll();
  </script>
</body>
</html>
