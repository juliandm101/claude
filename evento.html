<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heinbergo System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cempasuchil: #FF9500;
      --rosa:        #E91E8C;
      --verde:       #00A651;
      --azul:        #1565C0;
      --rojo:        #C62828;
      --amarillo:    #FFD100;
      --morado:      #7B1FA2;
      --text:        #f5e6d0;
      --text-muted:  #a08060;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #2d0a00 0%, #1a0800 55%, #0d0500 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 20px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--cempasuchil), var(--rosa));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    /* ── Papel picado ── */
    .papel-picado {
      width: 100%;
      height: 30px;
      margin: 16px 0 24px;
      overflow: hidden;
    }
    .papel-picado::after {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        var(--rosa)        0,          var(--rosa)        14.28%,
        var(--cempasuchil) 14.28%,     var(--cempasuchil) 28.57%,
        var(--verde)       28.57%,     var(--verde)       42.85%,
        var(--amarillo)    42.85%,     var(--amarillo)    57.14%,
        var(--azul)        57.14%,     var(--azul)        71.42%,
        var(--morado)      71.42%,     var(--morado)      85.71%,
        var(--rojo)        85.71%,     var(--rojo)        100%
      );
      clip-path: polygon(
        0 0, 1.5% 100%, 3% 0, 4.5% 100%, 6% 0, 7.5% 100%, 9% 0,
        10.5% 100%, 12% 0, 13.5% 100%, 15% 0, 16.5% 100%, 18% 0,
        19.5% 100%, 21% 0, 22.5% 100%, 24% 0, 25.5% 100%, 27% 0,
        28.5% 100%, 30% 0, 31.5% 100%, 33% 0, 34.5% 100%, 36% 0,
        37.5% 100%, 39% 0, 40.5% 100%, 42% 0, 43.5% 100%, 45% 0,
        46.5% 100%, 48% 0, 49.5% 100%, 51% 0, 52.5% 100%, 54% 0,
        55.5% 100%, 57% 0, 58.5% 100%, 60% 0, 61.5% 100%, 63% 0,
        64.5% 100%, 66% 0, 67.5% 100%, 69% 0, 70.5% 100%, 72% 0,
        73.5% 100%, 75% 0, 76.5% 100%, 78% 0, 79.5% 100%, 81% 0,
        82.5% 100%, 84% 0, 85.5% 100%, 87% 0, 88.5% 100%, 90% 0,
        91.5% 100%, 93% 0, 94.5% 100%, 96% 0, 97.5% 100%, 100% 0
      );
    }

    /* ── Storage bar ── */
    .storage-bar {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,149,0,0.2);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--verde);
      box-shadow: 0 0 8px var(--verde);
      flex-shrink: 0;
    }

    .storage-info {
      flex: 1;
      font-size: 0.9rem;
      color: #c0a080;
    }
    .storage-info span {
      font-size: 0.78rem;
      color: #70503a;
      margin-left: 8px;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover  { opacity: 0.82; }
    button:active { transform: scale(0.97); }

    .btn-primary   { background: var(--rosa); color: #fff; }
    .btn-ghost     { background: rgba(255,255,255,0.06); color: #c0a080; border: 1px solid rgba(255,255,255,0.1); }
    .btn-danger    { background: rgba(198,40,40,0.25); color: #ff6b6b; padding: 5px 10px; font-size: 0.8rem; }
    .btn-small     { padding: 6px 12px; font-size: 0.85rem; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.1;
      background: currentColor;
    }

    .stat-total     { color: var(--azul);        border-color: rgba(21,101,192,0.4); }
    .stat-confirmed { color: var(--verde);        border-color: rgba(0,166,81,0.4);  }
    .stat-pending   { color: var(--cempasuchil);  border-color: rgba(255,149,0,0.4); }
    .stat-collected { color: var(--rosa);         border-color: rgba(233,30,140,0.4);}

    .stat-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      margin-bottom: 10px;
      position: relative;
    }
    .stat-value {
      font-size: 2.1rem;
      font-weight: 900;
      position: relative;
      line-height: 1;
    }
    .stat-collected .stat-value { font-size: 1.3rem; }

    /* ── Section cards ── */
    .section-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .section-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    #guests-section::before { background: linear-gradient(90deg, var(--verde), var(--azul)); }
    #config-section::before { background: linear-gradient(90deg, var(--cempasuchil), var(--rosa)); }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    /* ── Add row ── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-row input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input[type="text"]:focus { border-color: var(--rosa); }

    /* ── Lists ── */
    .guest-list, .insumo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .guest-item, .insumo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 14px;
      transition: background 0.2s, border-color 0.2s;
    }
    .guest-item.confirmed {
      background: rgba(0,166,81,0.09);
      border-color: rgba(0,166,81,0.3);
    }

    .guest-name, .insumo-name { flex: 1; font-size: 0.9rem; }

    /* ── Custom checkbox ── */
    .custom-checkbox {
      position: relative;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .custom-checkbox input {
      opacity: 0; width: 0; height: 0;
      position: absolute;
    }
    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .custom-checkbox input:checked ~ .checkmark {
      background: var(--verde);
      border-color: var(--verde);
    }
    .checkmark::after {
      content: '';
      display: none;
      position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .custom-checkbox input:checked ~ .checkmark::after { display: block; }

    /* ── Insumo qty ── */
    .insumo-qty {
      width: 70px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }
    .insumo-qty:focus { border-color: var(--cempasuchil); }

    /* ── Config grid ── */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 600px) {
      .config-grid { grid-template-columns: 1fr; }
    }

    .config-field { display: flex; flex-direction: column; gap: 6px; }
    .config-field.full-width { grid-column: 1 / -1; }

    .config-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .config-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .config-input:focus { border-color: var(--cempasuchil); }
    textarea.config-input { resize: vertical; min-height: 80px; }

    /* ── Recaudado ── */
    .recaudado-box {
      background: linear-gradient(135deg, rgba(233,30,140,0.14), rgba(255,149,0,0.08));
      border: 1px solid rgba(233,30,140,0.35);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 18px;
    }
    .recaudado-formula { font-size: 0.85rem; color: #c0a080; margin-bottom: 6px; }
    .recaudado-total   { font-size: 1.7rem; font-weight: 900; color: var(--rosa); }

    /* ── Insumos sub ── */
    .insumos-sub {
      margin-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
    }

    /* ── Danger zone ── */
    .danger-zone { margin-top: 12px; text-align: right; }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .toast {
      background: rgba(45,10,0,0.97);
      border: 1px solid rgba(255,149,0,0.35);
      border-left: 3px solid var(--cempasuchil);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text);
      animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
      max-width: 280px;
    }
    @keyframes slideIn {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .empty-state {
      text-align: center;
      color: #604030;
      font-size: 0.85rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>&#x1F389; Heinbergo System</h1>
    <p>Organizador de Eventos</p>
  </header>

  <div class="papel-picado"></div>

  <!-- Storage bar -->
  <div class="storage-bar">
    <div class="dot"></div>
    <span class="storage-info">
      Guardado en este navegador
      <span id="last-saved"></span>
    </span>
    <button class="btn-ghost btn-small" id="btn-export">&#x2193; Exportar</button>
    <button class="btn-ghost btn-small" id="btn-import">&#x2191; Importar</button>
    <input type="file" id="input-import" accept=".json" style="display:none">
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card stat-total">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card stat-confirmed">
      <div class="stat-label">Confirmados</div>
      <div class="stat-value" id="stat-confirmed">0</div>
    </div>
    <div class="stat-card stat-pending">
      <div class="stat-label">Pendientes</div>
      <div class="stat-value" id="stat-pending">0</div>
    </div>
    <div class="stat-card stat-collected">
      <div class="stat-label">Recaudado</div>
      <div class="stat-value" id="stat-collected">$0</div>
    </div>
  </div>

  <!-- Invitados -->
  <div class="section-card" id="guests-section">
    <div class="section-title">&#x1F465; Invitados</div>
    <div class="add-row">
      <input type="text" id="new-guest" placeholder="Nombre del invitado...">
      <button class="btn-primary btn-small" id="btn-add-guest">+ Agregar</button>
    </div>
    <div class="guest-list" id="guest-list"></div>
  </div>

  <!-- Config -->
  <div class="section-card" id="config-section">
    <div class="section-title">&#x2699;&#xFE0F; Configuraci&#xF3;n</div>
    <div class="config-grid">
      <div class="config-field">
        <label class="config-label">Nombre del Evento</label>
        <input type="text" class="config-input" id="cfg-evento" placeholder="Mi Evento">
      </div>
      <div class="config-field">
        <label class="config-label">Fecha</label>
        <input type="text" class="config-input" id="cfg-fecha" placeholder="DD/MM/AAAA">
      </div>
      <div class="config-field">
        <label class="config-label">Importe por Persona</label>
        <input type="number" class="config-input" id="cfg-importe" placeholder="0" min="0">
      </div>
      <div class="config-field">
        <label class="config-label">Lugar</label>
        <input type="text" class="config-input" id="cfg-lugar" placeholder="Direcci&#xF3;n o lugar">
      </div>
      <div class="config-field full-width">
        <label class="config-label">Notas</label>
        <textarea class="config-input" id="cfg-notas" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>

    <div class="recaudado-box">
      <div class="recaudado-formula" id="recaudado-formula">0 confirmados &times; $0</div>
      <div class="recaudado-total" id="recaudado-total">$0</div>
    </div>

    <div class="insumos-sub">
      <div class="section-title">&#x1F4E6; Insumos</div>
      <div class="add-row">
        <input type="text" id="new-insumo" placeholder="Nombre del insumo...">
        <button class="btn-primary btn-small" id="btn-add-insumo">+ Agregar</button>
      </div>
      <div class="insumo-list" id="insumo-list"></div>
    </div>

    <div class="danger-zone">
      <button class="btn-danger" id="btn-reset">&#x1F5D1; Borrar todo</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    const LS_KEY = 'heinbergo_data';

    function loadData() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }

    function saveData() {
      localStorage.setItem(LS_KEY, JSON.stringify(appData));
      const t = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('last-saved').textContent = '\u00b7 guardado ' + t;
    }

    let appData = {
      guests:  [],
      config:  { evento: '', fecha: '', importe: '', lugar: '', notas: '' },
      insumos: []
    };

    // ── Render ──
    function renderGuests() {
      const list = document.getElementById('guest-list');
      if (!appData.guests.length) {
        list.innerHTML = '<div class="empty-state">A\u00fan no hay invitados \u{1F389}</div>';
        return;
      }
      list.innerHTML = appData.guests.map((g, i) => `
        <div class="guest-item${g.checked ? ' confirmed' : ''}">
          <span class="guest-name">${esc(g.name)}</span>
          <label class="custom-checkbox">
            <input type="checkbox" ${g.checked ? 'checked' : ''}
              onchange="toggleGuest(${i}, this.checked)">
            <span class="checkmark"></span>
          </label>
          <button class="btn-danger" onclick="removeGuest(${i})">&#x2715;</button>
        </div>
      `).join('');
    }

    function renderInsumos() {
      const list = document.getElementById('insumo-list');
      if (!appData.insumos.length) {
        list.innerHTML = '<div class="empty-state">A\u00fan no hay insumos</div>';
        return;
      }
      list.innerHTML = appData.insumos.map((ins, i) => `
        <div class="insumo-item">
          <span class="insumo-name">${esc(ins.name)}</span>
          <input type="number" class="insumo-qty" value="${esc(ins.qty)}" min="0"
            oninput="updateInsumoQty(${i}, this.value)">
          <button class="btn-danger" onclick="removeInsumo(${i})">&#x2715;</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total     = appData.guests.length;
      const confirmed = appData.guests.filter(g => g.checked).length;
      const pending   = total - confirmed;
      const importe   = parseFloat(appData.config.importe) || 0;
      const collected = confirmed * importe;

      document.getElementById('stat-total').textContent     = total;
      document.getElementById('stat-confirmed').textContent = confirmed;
      document.getElementById('stat-pending').textContent   = pending;
      document.getElementById('stat-collected').textContent = fmt(collected);
      document.getElementById('recaudado-formula').textContent =
        `${confirmed} confirmados \u00d7 $${importe.toLocaleString('es-AR')}`;
      document.getElementById('recaudado-total').textContent = fmt(collected);
    }

    function renderConfig() {
      ['evento','fecha','importe','lugar','notas'].forEach(k => {
        document.getElementById('cfg-' + k).value = appData.config[k] || '';
      });
    }

    function renderAll() {
      renderGuests();
      renderInsumos();
      renderConfig();
      updateStats();
    }

    // ── Acciones ──
    function toggleGuest(i, checked) {
      appData.guests[i].checked = checked;
      saveData(); renderAll();
    }

    function removeGuest(i) {
      const name = appData.guests[i].name;
      appData.guests.splice(i, 1);
      saveData(); renderAll();
      showToast(`"${name}" eliminado`);
    }

    function addGuest() {
      const inp  = document.getElementById('new-guest');
      const name = inp.value.trim();
      if (!name) return;
      if (appData.guests.some(g => g.name.toLowerCase() === name.toLowerCase())) {
        showToast('Ese invitado ya existe \u{1F914}'); return;
      }
      appData.guests.push({ name, checked: false });
      inp.value = '';
      saveData(); renderAll();
      showToast(`\u{1F389} "${name}" agregado`);
    }

    function addInsumo() {
      const inp  = document.getElementById('new-insumo');
      const name = inp.value.trim();
      if (!name) return;
      appData.insumos.push({ name, qty: '0' });
      inp.value = '';
      saveData(); renderAll();
      showToast(`"${name}" agregado`);
    }

    function removeInsumo(i) {
      const name = appData.insumos[i].name;
      appData.insumos.splice(i, 1);
      saveData(); renderAll();
      showToast(`"${name}" eliminado`);
    }

    function updateInsumoQty(i, value) {
      appData.insumos[i].qty = value;
      saveData(); updateStats();
    }

    ['evento','fecha','importe','lugar','notas'].forEach(k => {
      document.getElementById('cfg-' + k).addEventListener('input', function () {
        appData.config[k] = this.value;
        saveData(); updateStats();
      });
    });

    document.getElementById('new-guest').addEventListener('keydown',  e => { if (e.key === 'Enter') addGuest(); });
    document.getElementById('new-insumo').addEventListener('keydown', e => { if (e.key === 'Enter') addInsumo(); });
    document.getElementById('btn-add-guest').addEventListener('click',  addGuest);
    document.getElementById('btn-add-insumo').addEventListener('click', addInsumo);

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('\u00bfBorrar todos los datos? No se puede deshacer.')) return;
      appData = { guests: [], config: { evento:'', fecha:'', importe:'', lugar:'', notas:'' }, insumos: [] };
      saveData(); renderAll();
      showToast('\u{1F5D1} Datos borrados');
    });

    // ── Exportar / Importar ──
    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = (appData.config.evento || 'heinbergo') + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('\u2713 Exportado correctamente');
    });

    document.getElementById('btn-import').addEventListener('click', () => {
      document.getElementById('input-import').click();
    });

    document.getElementById('input-import').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imp = JSON.parse(e.target.result);
          if (!imp.guests || !imp.config || !imp.insumos) throw new Error('Formato inv\u00e1lido');
          appData = imp;
          saveData(); renderAll();
          showToast('\u2713 Importado: ' + file.name);
        } catch (err) {
          showToast('\u26a0 Error: ' + err.message);
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // ── Utils ──
    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className   = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3100);
    }

    function fmt(v) { return '$' + v.toLocaleString('es-AR'); }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Init ──
    const saved = loadData();
    if (saved) appData = saved;
    renderAll();
  </script>
</body>
</html>
