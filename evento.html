<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heinbergo System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d0d1a 0%, #0f2027 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #e94560, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #888;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* ── File bar ── */
    .file-bar {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e94560;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected { background: #2ecc71; }

    .file-name {
      flex: 1;
      font-size: 0.9rem;
      color: #aaa;
      min-width: 120px;
    }

    .file-status {
      font-size: 0.8rem;
      color: #666;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.97); }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #e0e0e0; }
    .btn-danger {
      background: rgba(233,69,96,0.2);
      color: #e94560;
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .btn-small { padding: 6px 12px; font-size: 0.85rem; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value { font-size: 1.8rem; font-weight: 700; }
    .stat-total    .stat-value { color: #a29bfe; }
    .stat-confirmed .stat-value { color: #2ecc71; }
    .stat-pending   .stat-value { color: #f39c12; }
    .stat-collected .stat-value { color: #e94560; font-size: 1.3rem; }

    /* ── Section cards ── */
    .section-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      transition: opacity 0.3s;
    }

    .locked {
      opacity: 0.4;
      pointer-events: none;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Add row ── */
    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-row input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-row input[type="text"]:focus { border-color: #e94560; }

    /* ── Lists ── */
    .guest-list, .insumo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .guest-item, .insumo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      transition: background 0.2s, border-color 0.2s;
    }

    .guest-item.confirmed {
      background: rgba(46,204,113,0.08);
      border-color: rgba(46,204,113,0.2);
    }

    .guest-name, .insumo-name { flex: 1; font-size: 0.9rem; }

    /* ── Custom checkbox ── */
    .custom-checkbox {
      position: relative;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .custom-checkbox input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-checkbox input:checked ~ .checkmark {
      background: #2ecc71;
      border-color: #2ecc71;
    }
    .checkmark::after {
      content: '';
      display: none;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .custom-checkbox input:checked ~ .checkmark::after { display: block; }

    /* ── Insumo qty ── */
    .insumo-qty {
      width: 70px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 4px 8px;
      color: #e0e0e0;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }
    .insumo-qty:focus { border-color: #f39c12; }

    /* ── Config grid ── */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 600px) {
      .config-grid { grid-template-columns: 1fr; }
    }

    .config-field { display: flex; flex-direction: column; gap: 6px; }
    .config-field.full-width { grid-column: 1 / -1; }

    .config-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .config-input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .config-input:focus { border-color: #a29bfe; }
    textarea.config-input { resize: vertical; min-height: 80px; }

    /* ── Recaudado box ── */
    .recaudado-box {
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-top: 16px;
    }
    .recaudado-formula { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
    .recaudado-total { font-size: 1.5rem; font-weight: 700; color: #e94560; }

    /* ── Insumos subsection ── */
    .insumos-sub {
      margin-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .toast {
      background: rgba(30,30,50,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #e0e0e0;
      animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
      max-width: 280px;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .empty-state {
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Heinbergo System</h1>
    <p>Organizador de Eventos</p>
  </header>

  <!-- File bar -->
  <div class="file-bar" id="file-bar">
    <div class="dot" id="dot"></div>
    <span class="file-name" id="file-name">Sin archivo conectado</span>
    <span class="file-status" id="file-status">Auto-guardado inactivo</span>
    <button class="btn-primary btn-small" id="btn-connect">Conectar</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card stat-total locked" id="sc-total">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card stat-confirmed locked" id="sc-confirmed">
      <div class="stat-label">Confirmados</div>
      <div class="stat-value" id="stat-confirmed">0</div>
    </div>
    <div class="stat-card stat-pending locked" id="sc-pending">
      <div class="stat-label">Pendientes</div>
      <div class="stat-value" id="stat-pending">0</div>
    </div>
    <div class="stat-card stat-collected locked" id="sc-collected">
      <div class="stat-label">Recaudado</div>
      <div class="stat-value" id="stat-collected">$0</div>
    </div>
  </div>

  <!-- Guests section -->
  <div class="section-card locked" id="guests-section">
    <div class="section-title">👥 Invitados</div>
    <div class="add-row">
      <input type="text" id="new-guest" placeholder="Nombre del invitado...">
      <button class="btn-primary btn-small" id="btn-add-guest">+ Agregar</button>
    </div>
    <div class="guest-list" id="guest-list"></div>
  </div>

  <!-- Config section -->
  <div class="section-card locked" id="config-section">
    <div class="section-title">⚙️ Configuración</div>
    <div class="config-grid">
      <div class="config-field">
        <label class="config-label">Nombre del Evento</label>
        <input type="text" class="config-input" id="cfg-evento" placeholder="Mi Evento">
      </div>
      <div class="config-field">
        <label class="config-label">Fecha</label>
        <input type="text" class="config-input" id="cfg-fecha" placeholder="DD/MM/AAAA">
      </div>
      <div class="config-field">
        <label class="config-label">Importe por Persona</label>
        <input type="number" class="config-input" id="cfg-importe" placeholder="0" min="0">
      </div>
      <div class="config-field">
        <label class="config-label">Lugar</label>
        <input type="text" class="config-input" id="cfg-lugar" placeholder="Dirección o lugar">
      </div>
      <div class="config-field full-width">
        <label class="config-label">Notas</label>
        <textarea class="config-input" id="cfg-notas" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>

    <!-- Recaudado -->
    <div class="recaudado-box">
      <div class="recaudado-formula" id="recaudado-formula">0 confirmados × $0</div>
      <div class="recaudado-total" id="recaudado-total">$0</div>
    </div>

    <!-- Insumos subsection -->
    <div class="insumos-sub">
      <div class="section-title">📦 Insumos</div>
      <div class="add-row">
        <input type="text" id="new-insumo" placeholder="Nombre del insumo...">
        <button class="btn-primary btn-small" id="btn-add-insumo">+ Agregar</button>
      </div>
      <div class="insumo-list" id="insumo-list"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // ══════════════════════════════════════════
    // IndexedDB — persistencia del file handle
    // ══════════════════════════════════════════
    const DB_NAME    = 'HeinbergoDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'handles';
    const HANDLE_KEY = 'fileHandle';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function saveHandle(handle) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
      });
    }

    async function loadHandle() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
        req.onsuccess = e => resolve(e.target.result || null);
        req.onerror   = e => reject(e.target.error);
      });
    }

    // ══════════════════════════════════════════
    // Estado de la app
    // ══════════════════════════════════════════
    let fileHandle = null;
    let appData = {
      guests:  [],
      config:  { evento: '', fecha: '', importe: '', lugar: '', notas: '' },
      insumos: []
    };

    // ══════════════════════════════════════════
    // parseMD / buildMD
    // ══════════════════════════════════════════
    function parseMD(text) {
      const data = {
        guests:  [],
        config:  { evento: '', fecha: '', importe: '', lugar: '', notas: '' },
        insumos: []
      };
      let section = null;

      for (const raw of text.split('\n')) {
        const line = raw.trimEnd();
        if (line.startsWith('# Invitados')) { section = 'guests';  continue; }
        if (line.startsWith('# Config'))    { section = 'config';  continue; }
        if (line.startsWith('# Insumos'))   { section = 'insumos'; continue; }

        if (section === 'guests') {
          const m = line.match(/^- \[( |x)\] (.+)$/);
          if (m) data.guests.push({ name: m[2].trim(), checked: m[1] === 'x' });
        } else if (section === 'config') {
          const m = line.match(/^(\w+): (.*)$/);
          if (m && Object.prototype.hasOwnProperty.call(data.config, m[1])) {
            data.config[m[1]] = m[2].trim();
          }
        } else if (section === 'insumos') {
          const m = line.match(/^- \[(\d*)\] (.+)$/);
          if (m) data.insumos.push({ name: m[2].trim(), qty: m[1] });
        }
      }
      return data;
    }

    function buildMD(data) {
      const lines = ['# Invitados'];
      for (const g of data.guests)
        lines.push(`- [${g.checked ? 'x' : ' '}] ${g.name}`);

      lines.push('# Config');
      for (const key of ['evento', 'fecha', 'importe', 'lugar', 'notas'])
        lines.push(`${key}: ${data.config[key] || ''}`);

      lines.push('# Insumos');
      for (const ins of data.insumos)
        lines.push(`- [${ins.qty || '0'}] ${ins.name}`);

      return lines.join('\n') + '\n';
    }

    // ══════════════════════════════════════════
    // File operations
    // ══════════════════════════════════════════
    async function saveFile() {
      if (!fileHandle) return;
      try {
        const writable = await fileHandle.createWritable();
        await writable.write(buildMD(appData));
        await writable.close();
      } catch (e) {
        showToast('Error al guardar: ' + e.message);
      }
    }

    async function readFile() {
      const file = await fileHandle.getFile();
      return file.text();
    }

    // ══════════════════════════════════════════
    // Render
    // ══════════════════════════════════════════
    function renderGuests() {
      const list = document.getElementById('guest-list');
      if (appData.guests.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay invitados aún</div>';
        return;
      }
      list.innerHTML = appData.guests.map((g, i) => `
        <div class="guest-item${g.checked ? ' confirmed' : ''}">
          <span class="guest-name">${esc(g.name)}</span>
          <label class="custom-checkbox">
            <input type="checkbox" ${g.checked ? 'checked' : ''}
              onchange="toggleGuest(${i}, this.checked)">
            <span class="checkmark"></span>
          </label>
          <button class="btn-danger" onclick="removeGuest(${i})">✕</button>
        </div>
      `).join('');
    }

    function renderInsumos() {
      const list = document.getElementById('insumo-list');
      if (appData.insumos.length === 0) {
        list.innerHTML = '<div class="empty-state">No hay insumos aún</div>';
        return;
      }
      list.innerHTML = appData.insumos.map((ins, i) => `
        <div class="insumo-item">
          <span class="insumo-name">${esc(ins.name)}</span>
          <input type="number" class="insumo-qty" value="${esc(ins.qty)}" min="0"
            oninput="updateInsumoQty(${i}, this.value)">
          <button class="btn-danger" onclick="removeInsumo(${i})">✕</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total     = appData.guests.length;
      const confirmed = appData.guests.filter(g => g.checked).length;
      const pending   = total - confirmed;
      const importe   = parseFloat(appData.config.importe) || 0;
      const collected = confirmed * importe;

      document.getElementById('stat-total').textContent     = total;
      document.getElementById('stat-confirmed').textContent = confirmed;
      document.getElementById('stat-pending').textContent   = pending;
      document.getElementById('stat-collected').textContent = fmtCurrency(collected);

      document.getElementById('recaudado-formula').textContent =
        `${confirmed} confirmados × $${importe.toLocaleString('es-AR')}`;
      document.getElementById('recaudado-total').textContent = fmtCurrency(collected);
    }

    function renderConfig() {
      ['evento', 'fecha', 'importe', 'lugar', 'notas'].forEach(k => {
        document.getElementById('cfg-' + k).value = appData.config[k] || '';
      });
    }

    function renderAll() {
      renderGuests();
      renderInsumos();
      renderConfig();
      updateStats();
    }

    // ══════════════════════════════════════════
    // Acciones de usuario
    // ══════════════════════════════════════════
    function toggleGuest(i, checked) {
      appData.guests[i].checked = checked;
      saveFile().then(() => renderAll());
    }

    function removeGuest(i) {
      const name = appData.guests[i].name;
      appData.guests.splice(i, 1);
      saveFile().then(() => { renderAll(); showToast(`"${name}" eliminado`); });
    }

    function addGuest() {
      const input = document.getElementById('new-guest');
      const name  = input.value.trim();
      if (!name) return;
      if (appData.guests.some(g => g.name.toLowerCase() === name.toLowerCase())) {
        showToast('Ese invitado ya existe'); return;
      }
      appData.guests.push({ name, checked: false });
      input.value = '';
      saveFile().then(() => { renderAll(); showToast(`"${name}" agregado`); });
    }

    function addInsumo() {
      const input = document.getElementById('new-insumo');
      const name  = input.value.trim();
      if (!name) return;
      appData.insumos.push({ name, qty: '0' });
      input.value = '';
      saveFile().then(() => { renderAll(); showToast(`"${name}" agregado`); });
    }

    function removeInsumo(i) {
      const name = appData.insumos[i].name;
      appData.insumos.splice(i, 1);
      saveFile().then(() => { renderAll(); showToast(`"${name}" eliminado`); });
    }

    function updateInsumoQty(i, value) {
      appData.insumos[i].qty = value;
      saveFile();
    }

    // Config: guardar en tiempo real
    ['evento', 'fecha', 'importe', 'lugar', 'notas'].forEach(k => {
      document.getElementById('cfg-' + k).addEventListener('input', function () {
        appData.config[k] = this.value;
        saveFile();
        updateStats();
      });
    });

    // Enter para agregar
    document.getElementById('new-guest').addEventListener('keydown',  e => { if (e.key === 'Enter') addGuest(); });
    document.getElementById('new-insumo').addEventListener('keydown', e => { if (e.key === 'Enter') addInsumo(); });
    document.getElementById('btn-add-guest').addEventListener('click',  addGuest);
    document.getElementById('btn-add-insumo').addEventListener('click', addInsumo);

    // ══════════════════════════════════════════
    // Conexión del archivo
    // ══════════════════════════════════════════
    function unlock() {
      ['guests-section', 'config-section',
       'sc-total', 'sc-confirmed', 'sc-pending', 'sc-collected'].forEach(id => {
        document.getElementById(id).classList.remove('locked');
      });
    }

    function lock() {
      ['guests-section', 'config-section',
       'sc-total', 'sc-confirmed', 'sc-pending', 'sc-collected'].forEach(id => {
        document.getElementById(id).classList.add('locked');
      });
    }

    function setConnected(handle) {
      fileHandle = handle;
      document.getElementById('dot').classList.add('connected');
      document.getElementById('file-name').textContent  = handle.name;
      document.getElementById('file-status').textContent = 'Auto-guardado activo';
      document.getElementById('btn-connect').textContent = 'Cambiar';
      unlock();
    }

    async function connectFile(existingHandle = null) {
      try {
        let handle = existingHandle;

        if (!handle) {
          try {
            [handle] = await window.showOpenFilePicker({
              types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }],
              multiple: false
            });
          } catch (e) {
            if (e.name === 'AbortError') {
              if (!confirm('¿Crear un nuevo archivo guests.md?')) return;
              handle = await window.showSaveFilePicker({
                suggestedName: 'guests.md',
                types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
              });
              const w = await handle.createWritable();
              await w.write(buildMD(appData));
              await w.close();
            } else {
              throw e;
            }
          }
        }

        // Verificar / solicitar permiso
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') {
          const req = await handle.requestPermission({ mode: 'readwrite' });
          if (req !== 'granted') { showToast('Permiso denegado'); return; }
        }

        await saveHandle(handle);
        setConnected(handle);
        appData = parseMD(await readFile());
        renderAll();
        showToast('Archivo conectado: ' + handle.name);

      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    document.getElementById('btn-connect').addEventListener('click', () => connectFile());

    // ══════════════════════════════════════════
    // Auto-reconexión al cargar
    // ══════════════════════════════════════════
    async function tryAutoReconnect() {
      try {
        const handle = await loadHandle();
        if (!handle) return;

        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          setConnected(handle);
          appData = parseMD(await readFile());
          renderAll();
          showToast('Archivo reconectado automáticamente');
        } else {
          // Permiso expirado: mostrar botón Reconectar
          document.getElementById('file-name').textContent = handle.name + ' (permiso expirado)';
          const btn = document.createElement('button');
          btn.className   = 'btn-secondary btn-small';
          btn.textContent = 'Reconectar';
          btn.addEventListener('click', () => { btn.remove(); connectFile(handle); });
          document.getElementById('file-bar').appendChild(btn);
        }
      } catch (_) { /* fallo silencioso */ }
    }

    // ══════════════════════════════════════════
    // Utils
    // ══════════════════════════════════════════
    function showToast(msg) {
      const c     = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className   = 'toast';
      toast.textContent = msg;
      c.appendChild(toast);
      setTimeout(() => toast.remove(), 3100);
    }

    function fmtCurrency(v) {
      return '$' + v.toLocaleString('es-AR');
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ══════════════════════════════════════════
    // Init
    // ══════════════════════════════════════════
    tryAutoReconnect();
  </script>
</body>
</html>
